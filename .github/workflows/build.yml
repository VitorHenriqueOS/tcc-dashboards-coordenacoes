name: Build e Release

# - push na main e pull requests: compila Linux e Windows e guarda os
#   executáveis como artefatos da execução (aba Actions)
# - push de uma tag v* (ex.: v1.2.0): compila e publica uma Release com os executáveis
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Um novo push cancela a compilação anterior do mesmo branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NOME_APP: DashboardsCoordenacoes
  PYTHON_VERSION: '3.13'
  # 'true': cada nova Release substitui a anterior (economiza espaço)
  # 'false': guarda todas as versões
  MANTER_SO_A_ULTIMA: 'true'

jobs:
  build:
    name: Build ${{ matrix.sistema }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04: glibc mais antiga, o executável roda em mais distribuições
          - os: ubuntu-22.04
            sistema: linux
          - os: windows-latest
            sistema: windows
    defaults:
      run:
        shell: bash

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Bibliotecas do sistema usadas pelo Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxi6 libasound2

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Gerar executável com PyInstaller
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed \
            --name "$NOME_APP" \
            --add-data "src/web:web" \
            --hidden-import openpyxl \
            src/main.py

      # Roda o executável gerado em modo de verificação (sem abrir janela)
      - name: Verificar executável (Linux)
        if: runner.os == 'Linux'
        run: ./dist/"$NOME_APP" --verificar

      - name: Verificar executável (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Executável sem console: é preciso esperar o processo terminar para ler o código de saída
          $p = Start-Process -FilePath "dist\$env:NOME_APP.exe" -ArgumentList '--verificar' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Verificação do executável falhou (código $($p.ExitCode))" }

      - name: Empacotar
        run: |
          mkdir pacote
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "dist/$NOME_APP.exe" "pacote/$NOME_APP-windows.exe"
          else
            # O .tar.gz preserva a permissão de execução (o artefato do Actions não preserva)
            tar -czf "pacote/$NOME_APP-linux.tar.gz" -C dist "$NOME_APP"
          fi

      - name: Salvar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOME_APP }}-${{ matrix.sistema }}
          path: pacote/*
          if-no-files-found: error
          # Os executáveis são grandes (~300 MB); artefatos antigos ocupam a cota de armazenamento
          retention-days: 7

  release:
    name: Publicar Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessária para criar a Release
    steps:
      - name: Baixar artefatos gerados no build
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Criar Release e anexar executáveis
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Mantém só a Release recém-criada: apaga as anteriores e suas tags
      # (configurável em MANTER_SO_A_ULTIMA, no topo do arquivo)
      - name: Remover Releases anteriores
        if: env.MANTER_SO_A_ULTIMA == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_ATUAL: ${{ github.ref_name }}
        run: |
          gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[].tagName' |
          while read -r tag; do
            if [ "$tag" != "$TAG_ATUAL" ]; then
              echo "Removendo Release $tag"
              gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag
            fi
          done
