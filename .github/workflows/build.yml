name: Build Executáveis

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite disparar o build manualmente pelo painel do GitHub

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: app-linux
            output_file: dist/*
          - os: windows-latest
            artifact_name: app-windows
            output_file: dist/*.exe

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Gerar executável com PyInstaller
        run: |
          pyinstaller --onefile src/main.py

      - name: Salvar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_file }}