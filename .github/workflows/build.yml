name: Build and Release

on:
  push:
    tags:
      - 'v*' # Dispara automaticamente ao enviar tags como v1.0.0, v1.0.1, etc.
  workflow_dispatch: # Permite disparar manualmente pelo GitHub

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: meu-app-linux
            output_name: meu-app-linux
          - os: windows-latest
            artifact_name: meu-app-windows.exe
            output_name: meu-app-windows.exe

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências nativas (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libcairo2-dev \
            libgirepository1.0-dev \
            libgtk-3-dev \
            gir1.2-webkit2-4.1

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Gerar executável com PyInstaller
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed --name ${{ matrix.output_name }} src/main.py

      - name: Salvar artefato temporário
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.output_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão necessária para criar a Release no repositório
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Baixar artefatos gerados no build
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Criar Release e anexar executáveis
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/meu-app-linux
            release-assets/meu-app-windows.exe
          generate_release_notes: true